name: Validar Supleno Tipos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Executar testes de segurança e regressão
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validar conteúdo editorial
        run: python3 scripts/validate-content.py
      - name: Verificar whitespace do diff
        run: git diff --check
