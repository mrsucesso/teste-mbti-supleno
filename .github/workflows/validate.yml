name: Validar Supleno Tipos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Executar testes de segurança e regressão
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validar conteúdo editorial
        run: python3 scripts/validate-content.py
      - name: Verificar whitespace do diff
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^0+$ ]]; then
              before="$(git rev-list --max-parents=0 HEAD)"
            fi
            git diff --check "$before..${{ github.sha }}"
          fi
