<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="ogTitle ogDesc">
  <title id="ogTitle">Supleno Traços</title>
  <desc id="ogDesc">Ilustração de identidade original do Supleno Traços, com cinco barras representando as cinco dimensões contínuas de personalidade.</desc>
  <defs>
    <linearGradient id="bg-tracos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163736"/>
      <stop offset="100%" stop-color="#1F4B4C"/>
    </linearGradient>
    <linearGradient id="bar-tracos" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C15A38"/>
      <stop offset="100%" stop-color="#D9A441"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-tracos)"/>
  <rect x="820" y="330" width="48" height="150" rx="10" fill="url(#bar-tracos)"/>
  <rect x="888" y="260" width="48" height="220" rx="10" fill="url(#bar-tracos)"/>
  <rect x="956" y="180" width="48" height="300" rx="10" fill="url(#bar-tracos)"/>
  <rect x="1024" y="230" width="48" height="250" rx="10" fill="url(#bar-tracos)"/>
  <rect x="1092" y="300" width="48" height="180" rx="10" fill="url(#bar-tracos)"/>
  <text x="90" y="290" font-family="-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif" font-size="66" font-weight="800" fill="#FAF6F1">Supleno Traços</text>
  <text x="90" y="340" font-family="-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="600" fill="#D9A441">Cinco Dimensões de Personalidade</text>
  <text x="90" y="380" font-family="-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif" font-size="22" fill="#EADFD3">25 afirmações · resultado imediato</text>
</svg>
