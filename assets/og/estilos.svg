<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="ogTitle ogDesc">
  <title id="ogTitle">Supleno Estilos</title>
  <desc id="ogDesc">Ilustração de identidade original do Supleno Estilos, com quatro marcadores representando as quatro dimensões de estilo de comportamento.</desc>
  <defs>
    <linearGradient id="bg-estilos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163736"/>
      <stop offset="100%" stop-color="#1F4B4C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-estilos)"/>
  <circle cx="880" cy="200" r="70" fill="#C15A38"/>
  <circle cx="1040" cy="200" r="70" fill="#D9A441"/>
  <circle cx="880" cy="360" r="70" fill="#D9A441" opacity="0.85"/>
  <circle cx="1040" cy="360" r="70" fill="#FAF6F1" opacity="0.9"/>
  <text x="90" y="290" font-family="-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif" font-size="66" font-weight="800" fill="#FAF6F1">Supleno Estilos</text>
  <text x="90" y="340" font-family="-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="600" fill="#D9A441">Teste de Estilo de Comportamento</text>
  <text x="90" y="380" font-family="-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif" font-size="22" fill="#EADFD3">4 dimensões · resultado imediato</text>
</svg>
