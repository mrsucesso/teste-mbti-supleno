<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="ogTitle ogDesc">
  <title id="ogTitle">Supleno Tipos</title>
  <desc id="ogDesc">Ilustração de identidade original do Supleno Tipos, com um emblema em losango representando os 16 perfis de personalidade.</desc>
  <defs>
    <linearGradient id="bg-tipos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163736"/>
      <stop offset="100%" stop-color="#1F4B4C"/>
    </linearGradient>
    <linearGradient id="emblem-tipos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C15A38"/>
      <stop offset="100%" stop-color="#D9A441"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-tipos)"/>
  <circle cx="960" cy="300" r="230" fill="url(#emblem-tipos)" opacity="0.95"/>
  <polygon points="960,170 1060,300 960,430 860,300" fill="#FAF6F1" opacity="0.92"/>
  <circle cx="960" cy="460" r="26" fill="#D9A441"/>
  <text x="90" y="290" font-family="-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif" font-size="66" font-weight="800" fill="#FAF6F1">Supleno Tipos</text>
  <text x="90" y="340" font-family="-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="600" fill="#D9A441">Teste de Perfil de Personalidade</text>
  <text x="90" y="380" font-family="-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif" font-size="22" fill="#EADFD3">16 perfis · versões masculina e feminina</text>
</svg>
